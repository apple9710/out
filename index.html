<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프로젝트 데모</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #1b3832; background: #f5f6f1; font: 1rem/1.6 system-ui, sans-serif; }
    main { max-width: 48rem; margin: auto; padding: clamp(3rem, 10vw, 7rem) 1.5rem; }
    h1 { margin: 0 0 2rem; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -.06em; }
    a { display: flex; align-items: center; gap: 1.2rem; padding: 1.4rem; background: white; border: 1px solid #cdd8d1; border-radius: 18px; color: inherit; text-decoration: none; }
    a:hover, a:focus-visible { outline: 2px solid #39786b; }
    strong, small { display: block; }
    strong { font-size: 1.2rem; } small { font-size: .95rem; color: #47615a; }
  </style>
</head>
<body>
  <main>
    <h1>프로젝트 데모</h1>
    <a href="./jo-su-yeon/haksik-mate/">
      <img src="./jo-su-yeon/haksik-mate/icons/mark.svg" alt="" width="52" height="52">
      <span><strong>학식메이트</strong><small>캠퍼스 식사 모임 찾기 · 모집 · 참여</small></span>
    </a>
  </main>
</body>
</html>
